<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Acker Spurführung V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:850px;margin:auto;padding:12px}.card{background:#181818;border-radius:18px;padding:14px;margin:9px 0}
h1{font-size:23px}.row{display:flex;gap:8px}.row>*{flex:1}button,input{font:inherit}
button{border:0;border-radius:12px;padding:14px 8px;font-weight:800}button.dark{background:#333;color:#fff}button.red{background:#702929;color:#fff}
input{width:100%;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:10px;padding:11px;font-size:19px}
label{color:#aaa;font-size:13px}.arrow{text-align:center;font-size:105px;font-weight:900;line-height:.9}
.err{text-align:center;font-size:55px;font-weight:900}.hint{text-align:center;font-size:24px;font-weight:800}
.ok{color:#39d98a}.warn{color:#ffd24a}.bad{color:#ff5c5c}
.map{height:310px;background:#102015;border-radius:15px;position:relative;overflow:hidden;margin-top:12px}
.track{position:absolute;top:0;bottom:0;width:3px;background:#777}.target{width:7px;background:#fff}
.track span{position:absolute;top:8px;left:7px;color:#bbb;font-size:11px}
.vehicle{position:absolute;left:50%;top:68%;width:32px;height:32px;border-radius:50%;background:#ffd24a;transform:translate(-16px,-16px);z-index:5;border:3px solid #111}
.info{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{background:#292929;border-radius:99px;padding:6px 9px;font-size:12px}
small{color:#aaa}@media(orientation:landscape){h1,.setup{display:none}.map{height:190px}.arrow{font-size:80px}.err{font-size:48px}}
</style></head><body><main>
<h1>🚜 Acker Spurführung V2</h1>
<div class="card setup">
<div class="row"><div><label>Arbeitsbreite</label><input value="12.5" readonly></div>
<div><label>Toleranz (m)</label><input id="tol" type="number" value="0.35" step="0.05"></div></div>
<div class="row" style="margin-top:9px"><button id="gps">GPS starten</button><button id="a" class="dark">A setzen</button><button id="b" class="dark">B setzen</button></div>
<div class="row" style="margin-top:8px"><button id="swap" class="dark">Richtung drehen</button><button id="reset" class="red">AB löschen</button></div>
</div>
<div class="card">
<div id="arrow" class="arrow">•</div><div id="err" class="err">–</div><div id="hint" class="hint">AB-Linie setzen</div>
<div class="map" id="map"><div id="tracks"></div><div id="vehicle" class="vehicle"></div></div>
<div class="info"><span id="stat" class="pill">GPS: aus</span><span id="acc" class="pill">Genauigkeit: –</span><span id="spd" class="pill">Tempo: –</span><span id="line" class="pill">Spur: –</span></div>
</div>
<div class="card setup"><small>Nach A und B werden die aktuelle Fahrspur (weiß) und benachbarte 12,5-m-Spuren (grau) sichtbar. Die gelbe Markierung ist deine GPS-Position relativ zur Sollspur.</small></div>
<script>
const $=x=>document.getElementById(x),R=6378137;let P=null,A=null,B=null,wid=null;
function xy(p,o){let l=o.lat*Math.PI/180;return{x:(p.lon-o.lon)*Math.PI/180*R*Math.cos(l),y:(p.lat-o.lat)*Math.PI/180*R}}
function calc(p,a,b){let q=xy(p,a),v=xy(b,a),L=Math.hypot(v.x,v.y);if(L<2)return null;let ux=v.x/L,uy=v.y/L,nx=-uy,ny=ux;return q.x*nx+q.y*ny}
function tracks(k=0){let h=$('tracks');h.innerHTML='';[-2,-1,0,1,2].forEach(o=>{let d=document.createElement('div');d.className='track '+(o===0?'target':'');d.style.left=(50+o*20)+'%';let s=document.createElement('span');s.textContent='Spur '+((k+o)>=0?'+':'')+(k+o);d.appendChild(s);h.appendChild(d)})}
function save(){localStorage.setItem('abv2',JSON.stringify({A,B}))}
function update(){if(!P)return;$('stat').textContent='GPS: aktiv';$('acc').textContent='Genauigkeit: ±'+Math.round(P.acc)+' m';$('spd').textContent='Tempo: '+((P.speed||0)*3.6).toFixed(1)+' km/h';
if(!A||!B){$('hint').textContent=!A?'Punkt A setzen':'Gerade fahren, dann B setzen';return}
let c=calc(P,A,B);if(c===null)return;let k=Math.round(c/12.5),e=c-k*12.5,ab=Math.abs(e),tol=parseFloat($('tol').value)||.35;
$('line').textContent='Spur: '+(k>=0?'+':'')+k;$('err').textContent=Math.round(ab*100)+' cm';tracks(k);
$('vehicle').style.left=(50+Math.max(-2,Math.min(2,e))/2*42)+'%';
let cl=ab<=tol?'ok':ab<=.9?'warn':'bad';$('arrow').className='arrow '+cl;$('err').className='err '+cl;
$('arrow').textContent=ab<=tol?'↑':e>0?'→':'←';$('hint').textContent=ab<=tol?'SPUR HALTEN':e>0?'RECHTS KORRIGIEREN':'LINKS KORRIGIEREN'}
$('gps').onclick=()=>{if(!navigator.geolocation)return alert('GPS nicht verfügbar');wid=navigator.geolocation.watchPosition(g=>{P={lat:g.coords.latitude,lon:g.coords.longitude,acc:g.coords.accuracy,speed:g.coords.speed};update()},e=>alert(e.message),{enableHighAccuracy:true,maximumAge:0,timeout:15000})};
$('a').onclick=()=>{if(!P)return alert('GPS starten');A={lat:P.lat,lon:P.lon};save();update()};$('b').onclick=()=>{if(!P)return alert('GPS starten');B={lat:P.lat,lon:P.lon};save();update()};
$('swap').onclick=()=>{if(A&&B){let t=A;A=B;B=t;save();update()}};$('reset').onclick=()=>{A=B=null;save();$('err').textContent='–';$('hint').textContent='AB-Linie setzen';tracks()};
try{let d=JSON.parse(localStorage.getItem('abv2')||'{}');A=d.A||null;B=d.B||null}catch(e){} tracks();
</script></main></body></html>
